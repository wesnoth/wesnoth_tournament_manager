services:
  mariadb:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: tournament
      MARIADB_USER: tournament
      MARIADB_PASSWORD: tournament-dev
      MARIADB_ROOT_PASSWORD: root-dev
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./backend/src/config/schema.sql:/docker-entrypoint-initdb.d/10-tournament.sql:ro
      - ./MariaDB_forum_schema.sql:/docker-entrypoint-initdb.d/20-forum-reference.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: tournament
      DB_USER: tournament
      DB_PASSWORD: tournament-dev
      PHPBB_DB_HOST: mariadb
      PHPBB_DB_USER: tournament
      PHPBB_DB_PASSWORD: tournament-dev
      PHPBB_DB_NAME: tournament
      FORUM_DB_HOST: mariadb
      FORUM_DB_USER: tournament
      FORUM_DB_PASSWORD: tournament-dev
      FORUM_DB_NAME: tournament
      JWT_SECRET: local-docker-secret-change-outside-development
      FRONTEND_URL: http://localhost:5173
      PORT: 3000
      NODE_ENV: development
    depends_on:
      mariadb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:3000/api
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mariadb_data:
