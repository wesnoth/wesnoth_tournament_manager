<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/shield.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=10.0, user-scalable=yes" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Wesnoth Tournament Manager</title>
    <script>
      // Apply the visual theme before the first paint so the page does not
      // flash the wrong palette. Mirrors src/store/themeStore.ts: an explicit
      // choice wins, then the cached site default, then the fallback. Kept
      // inline because an external script would load too late to avoid the
      // flash. Storage access can throw, so every failure keeps the fallback.
      // A custom theme applies the CSS variables cached by the store; only
      // variable names and channel or hex values are accepted, so a tampered
      // cache cannot inject other styles.
      (function () {
        var themes = ['medieval', 'ranked'];
        var root = document.documentElement;
        var theme = 'medieval';
        try {
          var explicit = localStorage.getItem('theme');
          var siteDefault = localStorage.getItem('themeDefault');
          if (themes.indexOf(siteDefault) !== -1) theme = siteDefault;
          if (themes.indexOf(explicit) !== -1) theme = explicit;
          if (explicit === 'custom') {
            var custom = JSON.parse(localStorage.getItem('themeCustom') || 'null');
            if (custom && custom.config && themes.indexOf(custom.config.base) !== -1 && custom.vars) {
              theme = custom.config.base;
              root.setAttribute('data-custom-theme', '');
              for (var name in custom.vars) {
                var value = String(custom.vars[name]);
                if (/^--[a-z0-9-]+$/.test(name) && /^(\d{1,3} \d{1,3} \d{1,3}|#[0-9a-f]{6})$/i.test(value)) {
                  root.style.setProperty(name, value);
                }
              }
            }
          }
        } catch (e) {}
        root.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
