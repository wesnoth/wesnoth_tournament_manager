<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Blue shield background -->
  <path d="M 50 10 L 85 30 L 85 55 Q 85 75 50 90 Q 15 75 15 55 L 15 30 Z" fill="#2C5AA0" stroke="#1A3A6B" stroke-width="1"/>
  
  <!-- Shield highlight/3D effect -->
  <path d="M 50 10 L 85 30 L 85 55 Q 85 75 50 90 Q 15 75 15 55 L 15 30 Z" fill="none" stroke="#5B8FD4" stroke-width="0.5" opacity="0.6"/>
  
  <!-- Wesnoth emblem: stylized spear/cross -->
  <g transform="translate(50, 50)">
    <!-- Horizontal bar -->
    <rect x="-18" y="-4" width="36" height="8" fill="#FFD700" rx="2"/>
    
    <!-- Vertical bar -->
    <rect x="-4" y="-20" width="8" height="40" fill="#FFD700" rx="2"/>
    
    <!-- Center ornament -->
    <circle cx="0" cy="0" r="6" fill="#FF6B35"/>
    <circle cx="0" cy="0" r="4" fill="#FFD700"/>
  </g>
</svg>
